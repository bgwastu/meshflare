name: Demo

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "worker/demo/**"
      - "server/demo-worker.ts"
      - "wrangler.demo.jsonc"
      - "package.json"
      - "bun.lock"
      - "index.html"
      - "public/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy Workers demo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.20.0"
          command: deploy -c wrangler.demo.jsonc
