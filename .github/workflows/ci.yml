name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # worker-configuration.d.ts is generated and gitignored.
      - run: bun run cf:typegen
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Apply migrations to a fresh database
        run: DATA_DIR="$RUNNER_TEMP/meshflare" bun run db:migrate
